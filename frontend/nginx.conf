server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static files directly
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: pass API calls to gateway on same host (if you set that up)
  # location /api/ {
  #   proxy_pass http://host.docker.internal:8000;
  # }

  # Caching: don't cache index.html so deployed SPA updates correctly
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  # Serve other assets with long cache lifetime
  location ~* \.(?:css|js|json|xml|map|svg|png|jpg|jpeg|gif|ico)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}

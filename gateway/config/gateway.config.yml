              origin: ['${FRONTEND_URL}', 'http://localhost:5173', 'http://127.0.0.1:5173']
              methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
              credentials: true
      - proxy:
          - action:
              serviceEndpoint: template-service
              changeOrigin: true

  file-pipeline:
    apiEndpoints:
      - files
    policies:
      - cors:
          - action:
              origin: ['${FRONTEND_URL}', 'http://localhost:5173', 'http://127.0.0.1:5173']
              methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
              credentials: true
      - proxy:
          - action:
              serviceEndpoint: file-service
              changeOrigin: true

  analytics-graphql-pipeline:
    apiEndpoints:
      - analytics-graphql
    policies:
      - cors:
          - action:
              origin: ['${FRONTEND_URL}', 'http://localhost:5173', 'http://127.0.0.1:5173']
              methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
              credentials: true
      - proxy:
          - action:
              serviceEndpoint: analytics-service
              changeOrigin: true

  notification-pipeline:

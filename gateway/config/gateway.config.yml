http:
  port: ${PORT}


apiEndpoints:
  auth:
    paths:
      - /api/auth/login
      - /api/auth/logout



  users:
    paths:
      - /api/user/*
      - /api/admin/*
      - /api/doc-controller/*


  documents:
    paths:
      - /api/documents/*
  
  files:
    paths:
      - /api/files/*
      - /uploads/*
      - /api/storage/*

  templates:
    paths:
      - /api/templates/*

  analytics-graphql:
    paths:
      - /graphql

  notifications:
    paths:
      - /api/notifications
      - /api/notifications/*



serviceEndpoints:
  auth-service:
    url: ${AUTH_SERVICE_URL}
  user-service:
    url: ${USER_SERVICE_URL}
  document-service:
    url: ${DOCUMENT_SERVICE_URL}
  template-service:
    url: ${TEMPLATE_SERVICE_URL}
  file-service:
    url: ${FILE_SERVICE_URL}
  analytics-service:
    url: ${ANALYTICS_SERVICE_URL}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL}

policies:
  - jwt
  - proxy
  - cors
  - rate-limit

pipelines:
  auth-pipeline:
    apiEndpoints:
      - auth
    policies:
      - cors:
          - action:
              origin: ['${FRONTEND_URL}', 'http://localhost:5173', 'http://127.0.0.1:5173']
              methods:
                - GET
                - POST
                - PATCH
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Content-Type
                - Authorization
                - X-Requested-With
                - Accept
              credentials: true
      - proxy:
          - action:
              serviceEndpoint: auth-service
              changeOrigin: true

  user-pipeline:
    apiEndpoints:
      - users
    policies:
      - cors:
          - action:
              origin: ['${FRONTEND_URL}', 'http://localhost:5173', 'http://127.0.0.1:5173']
              methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
              credentials: true
      - proxy:
          - action:
              serviceEndpoint: user-service
              changeOrigin: true

  document-pipeline:
    apiEndpoints:
      - documents
    policies:
      - cors:
          - action:
              origin: ['${FRONTEND_URL}', 'http://localhost:5173', 'http://127.0.0.1:5173']
              methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
              credentials: true
      - proxy:
          - action:
              serviceEndpoint: document-service
              changeOrigin: true

  template-pipeline:

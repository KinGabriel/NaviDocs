              origin: ['${FRONTEND_URL}', 'http://localhost:5173', 'http://127.0.0.1:5173']
              methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
              credentials: true
      - proxy:
          - action:
              serviceEndpoint: notification-service
              changeOrigin: true




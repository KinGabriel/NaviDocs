http:
  port: ${PORT}


apiEndpoints:
  auth:
    paths:
      - /api/auth/login
      - /api/auth/logout



  users:
    paths:
      - /api/user/*
      - /api/admin/*
      - /api/doc-controller/*


  documents:
    paths:
      - /api/documents/*
  
  files:
    paths:
      - /api/files/*
      - /uploads/*
      - /api/storage/*

  templates:
    paths:
      - /api/templates/*

  analytics-graphql:
    paths:
      - /graphql



serviceEndpoints:
  auth-service:
    url: ${AUTH_SERVICE_URL}
  user-service:
    url: ${USER_SERVICE_URL}
  document-service:
    url: ${DOCUMENT_SERVICE_URL}
  template-service:
    url: ${TEMPLATE_SERVICE_URL}
  file-service:
    url: ${FILE_SERVICE_URL}
  analytics-service:
    url: ${ANALYTICS_SERVICE_URL}

policies:
  - jwt
  - proxy
  - cors
  - rate-limit

pipelines:
  auth-pipeline:
    apiEndpoints:
      - auth
    policies:
      - proxy:
          - action:
              serviceEndpoint: auth-service
              changeOrigin: true

  user-pipeline:
    apiEndpoints:
      - users
    policies:
      - proxy:
          - action:
              serviceEndpoint: user-service
              changeOrigin: true

  document-pipeline:
    apiEndpoints:
      - documents
    policies: 
      - proxy:
          - action:
              serviceEndpoint: document-service
              changeOrigin: true

  template-pipeline:
    apiEndpoints:
      - templates
    policies:    
      - proxy:
          - action:
              serviceEndpoint: template-service
              changeOrigin: true  

  file-pipeline:
      apiEndpoints:
        - files
      policies:
        - proxy:
            - action:
                serviceEndpoint: file-service
                changeOrigin: true

  analytics-graphql-pipeline:
    apiEndpoints:
      - analytics-graphql
    policies:
      - proxy:
          - action:
              serviceEndpoint: analytics-service
              changeOrigin: true




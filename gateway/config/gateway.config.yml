http:
  port: ${PORT}

apiEndpoints:
  auth:
    host: ${HOST}
    paths:
      - /api/auth/login
      - /api/auth/logout



  users:
    host: localhost
    paths:
      - /api/user/*
      - /api/admin/*
      - /api/doc-controller/*


  documents:
    host: ${HOST}
    paths:
      - /api/documents/*
  
  files:
    host: ${HOST}
    paths:
      - /api/files/*
      - /uploads/*

  templates:
    host: ${HOST}
    paths:
      - /api/templates/*

  analytics-graphql:
    host: localhost
    paths:
      - /graphql



serviceEndpoints:
  auth-service:
    url: ${AUTH_SERVICE_URL}
  user-service:
    url: ${USER_SERVICE_URL}
  document-service:
    url: ${DOCUMENT_SERVICE_URL}
  template-service:
    url: ${TEMPLATE_SERVICE_URL}
  file-service:
    url: ${FILE_SERVICE_URL}
  analytics-service:
    url: ${ANALYTICS_SERVICE_URL}

policies:
  - jwt
  - proxy
  - cors
  - rate-limit

pipelines:
  auth-pipeline:
    apiEndpoints:
      - auth
    policies:
      - cors:
          - action:
              origin: ${FRONTEND_URL}
              methods: "GET,PUT,OPTIONS"
              credentials: true
              allowedHeaders: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
      - proxy:
          - action:
              serviceEndpoint: auth-service
              changeOrigin: true

  user-pipeline:
    apiEndpoints:
      - users
    policies:
      - cors:
          - action:
              origin: ${FRONTEND_URL}
              methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
              credentials: true
              allowedHeaders: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
      - proxy:
          - action:
              serviceEndpoint: user-service
              changeOrigin: true

  document-pipeline:
    apiEndpoints:
      - documents
    policies:
      - cors:
          - action:
              origin: ${FRONTEND_URL}
              methods: "GET,POST,PUT,DELETE,OPTIONS"
              credentials: true
              allowedHeaders: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
   
      - proxy:
          - action:
              serviceEndpoint: document-service
              changeOrigin: true

  template-pipeline:
    apiEndpoints:
      - templates
    policies:
      - cors:
          - action:
              origin: ${FRONTEND_URL}
              methods: "GET,POST,PUT,DELETE,OPTIONS"
              credentials: true
              allowedHeaders: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
    
      - proxy:
          - action:
              serviceEndpoint: template-service
              changeOrigin: true  

  file-pipeline:
      apiEndpoints:
        - files
      policies:
        - cors:
            - action:
                origin: ${FRONTEND_URL}
                methods: "GET,POST,PUT,DELETE,OPTIONS"
                credentials: false
                allowedHeaders: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
        - proxy:
            - action:
                serviceEndpoint: file-service
                changeOrigin: true

  analytics-graphql-pipeline:
    apiEndpoints:
      - analytics-graphql
    policies:
      - cors:
          - action:
              origin: ${FRONTEND_URL}
              methods: "POST,OPTIONS"
              credentials: true
              allowedHeaders: "Origin, X-Requested-With, Content-Type, Accept, Authorization"
      - proxy:
          - action:
              serviceEndpoint: analytics-service
              changeOrigin: true



